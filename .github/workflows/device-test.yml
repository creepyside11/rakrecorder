name: Android VPN integration test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android VPN on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            python3 -m http.server 8765 --bind 0.0.0.0 >/tmp/rak-http.log 2>&1 &
            gradle --no-daemon connectedDebugAndroidTest || { adb logcat -d -s RakRecorder:E AndroidRuntime:E; exit 1; }
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
