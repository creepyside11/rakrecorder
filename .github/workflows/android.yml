name: Android alpha build
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RakRecorder-alpha-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish clearly labeled alpha prerelease
        if: github.ref == 'refs/heads/rakrecorder-alpha'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.1-alpha >/dev/null 2>&1; then
            gh release create v0.1.1-alpha app/build/outputs/apk/debug/app-debug.apk \
              --target "$GITHUB_SHA" --prerelease \
              --title "RakRecorder 0.1.1 — ранняя альфа" \
              --notes "Только импорт PCAP, ручные отметки и ZIP. VPN-захват, маршрут, декодирование игры и запись экрана отсутствуют. Это debug APK; подпись может отличаться у следующих сборок. Экспорт PCAP может содержать личные данные."
          fi
